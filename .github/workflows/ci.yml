name: CI
on:
  pull_request:
  # Appele par le workflow Deploy sur master : les tests tournent une seule fois,
  # et un deploiement ne part jamais sans eux.
  workflow_call:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore
      - run: dotnet build --no-restore
      - run: dotnet test --no-build
